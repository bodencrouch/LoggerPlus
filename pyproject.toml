[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loggerplus"
version = "0.2.0"
description = "Multiprocess-safe rotating logger with rich exception formatting"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "bodencrouch" }]
dependencies = [

]

[project.urls]
Homepage = "https://github.com/bodencrouch/loggerplus"
Repository = "https://github.com/bodencrouch/loggerplus"

[tool.setuptools.packages.find]
where = ["src"]
